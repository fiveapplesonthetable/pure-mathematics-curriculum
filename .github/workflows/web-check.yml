name: Web edition check

on:
  pull_request:
    paths: ['app/**', 'src/**', 'books/**', '.github/workflows/web-check.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      # Headless Chrome: console errors, 360px overflow, light/dark, reduced motion.
      - run: node scripts/check.mjs --build --all
        env:
          CHROME: /usr/bin/google-chrome
