<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Proofs From the Ground Up: an interactive web edition." />
    <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <title>Proofs From the Ground Up</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('pfg:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div class="progress" aria-hidden="true"><div class="progress-bar"></div></div>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
