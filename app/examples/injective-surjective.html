<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Injective and surjective</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
:root{--bg:#f6f3ee;--fg:#22201c;--muted:#6d675e;--acc:#D2553C}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171614;--fg:#eeeae3;--muted:#a39d93}}
:root[data-theme=dark]{--bg:#171614;--fg:#eeeae3;--muted:#a39d93}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.65 system-ui,-apple-system,sans-serif}
main{max-width:65ch;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.3rem;font-weight:600;margin:0 0 .5rem}
p{margin:.6rem 0}.muted{color:var(--muted);font-size:.9rem}
svg{width:100%;height:auto;display:block;margin:.5rem 0;user-select:none}
.node{fill:var(--bg);stroke:var(--fg);stroke-width:1.5}
.dom{cursor:pointer}.dom:focus circle{stroke:var(--acc);stroke-width:3}
.hit{fill:var(--acc);fill-opacity:.16;stroke:var(--acc)}
text{fill:var(--fg);font-size:15px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.arr{stroke:var(--acc);stroke-width:2;fill:none;transition:d .3s ease}
.miss circle{stroke:var(--muted);stroke-dasharray:3 3}
button{font:inherit;font-size:.9rem;color:var(--fg);background:none;border:1px solid var(--muted);border-radius:6px;padding:4px 12px;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ok{color:var(--acc);font-weight:600}
@media(prefers-reduced-motion:reduce){.arr{transition:none}}
</style></head><body><main>
<h1>Injective, surjective, bijective</h1>
<p>A function <span class="m">f:A\to B</span> sends each element of <span class="m">A</span> to exactly one element of <span class="m">B</span>.</p>
<svg id="s" viewBox="0 0 400 300" role="group" aria-label="Function from four elements to four elements"></svg>
<div class="row"><p class="muted" style="margin:0">Tap an element of A to change where it goes.</p><button id="reset">Reset</button></div>
<p id="r"></p>
</main>
<script>
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("s"),$=id=>document.getElementById(id);
const A=["a","b","c","d"],B=["1","2","3","4"],Y=i=>45+i*70,XA=90,XB=310,START=[0,1,2,3];
let f=START.slice();
const el=(t,at,p=svg)=>{const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);p.appendChild(e);return e};
const arrows=A.map(()=>el("path",{class:"arr","marker-end":"url(#m)"}));
const defs=el("defs",{});const mk=el("marker",{id:"m",viewBox:"0 0 10 10",refX:9,refY:5,markerWidth:7,markerHeight:7,orient:"auto"},defs);
el("path",{d:"M0 0L10 5L0 10z",fill:"var(--acc)"},mk);
const bn=B.map((t,i)=>{const g=el("g",{});el("circle",{class:"node",cx:XB,cy:Y(i),r:20},g);const x=el("text",{x:XB,y:Y(i)},g);x.textContent=t;return g});
const an=A.map((t,i)=>{const g=el("g",{class:"dom",tabindex:0,role:"button","aria-label":"Element "+t+", change its image"},svg);
  el("circle",{class:"node",cx:XA,cy:Y(i),r:20},g);const x=el("text",{x:XA,y:Y(i)},g);x.textContent=t;
  const go=()=>{f[i]=(f[i]+1)%4;draw()};g.onclick=go;g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}};return g});
function draw(){
  f.forEach((j,i)=>arrows[i].setAttribute("d",`M${XA+22} ${Y(i)} C ${XA+90} ${Y(i)}, ${XB-90} ${Y(j)}, ${XB-24} ${Y(j)}`));
  const hit=new Set(f);bn.forEach((g,j)=>g.setAttribute("class",hit.has(j)?"":"miss"));
  const inj=hit.size===4,sur=hit.size===4; // |A|=|B|=4, so the two coincide
  const dup=f.length-hit.size;
  const msg=inj?"Every element of B is hit exactly once, so f is injective, surjective and bijective.":
    `${dup} element${dup>1?"s":""} of A share${dup>1?"":"s"} an image, so f is not injective. ${4-hit.size} element${4-hit.size>1?"s":""} of B ${4-hit.size>1?"are":"is"} never hit (dashed), so f is not surjective.`;
  $("r").innerHTML=(inj?'<span class="ok">Bijective.</span> ':"")+msg;
}
$("reset").onclick=()=>{f=START.slice();draw()};
window.addEventListener("DOMContentLoaded",()=>{document.querySelectorAll(".m").forEach(m=>katex.render(m.textContent,m,{throwOnError:false}));draw()});
</script></body></html>
